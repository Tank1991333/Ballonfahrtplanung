<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Windy Ballonplaner</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    style.css
</head>

<body>

<header>
    <div>
        <b>Windy Ballonplaner</b>
        <span>Trajektorien nach Wettermodell und Höhe</span>
    </div>
</header>

<main>

    <aside>

        <div class="warn">
            <b>Hinweis</b><br>
            Nur als Planungshilfe verwenden.
        </div>

        <label>Breitengrad</label>
        <input id="lat" type="number" step="0.0001" value="47.2810">

        <label>Längengrad</label>
        <input id="lon" type="number" step="0.0001" value="15.9700">

        <label>Startzeit</label>
        <input id="start" type="datetime-local">

        <label>Flugdauer (Stunden)</label>
        <input
            id="duration"
            type="number"
            min="0.5"
            max="12"
            step="0.5"
            value="2"
        >

        <label>Wettermodell</label>
        <select id="model">
            <option value="iconD2">ICON-D2</option>
            <option value="iconEu">ICON-EU</option>
            <option value="icon">ICON Global</option>
            <option value="gfs">GFS</option>
        </select>

        <label>Höhen auswählen</label>
        <div id="levels"></div>

        <button id="run">
            Trajektorien berechnen
        </button>

        <div id="status"></div>
        <div id="results"></div>

    </aside>

    <section id="map"></section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/script>
<script src="app.js"></script>

</body>
</html>
